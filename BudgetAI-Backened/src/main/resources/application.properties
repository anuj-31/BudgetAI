
# Mysql
spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

server.servlet.context-path=/api/v1.0

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#
# ? Brevo HTTP API (ONLY THIS)
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_FROM_EMAIL}
brevo.sender.name=Money Manager

# JWT
jwt.secret=${JWT_SECRET}

## URLs
money.manager.frontend.url=${FRONTED_URL}
app.activation.url=${BACK_URL}
